name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    permissions:
      security-events: write # for github/codeql-action/*
    with:
      implicit_provenance_casts: false # we cast ptr to int to move check in test (addr requires Rust 1.84)
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    with:
      rust: 1.71,stable,beta,nightly
      additional-no-std-crates: tests/no-std,tests/rust-2015
      miri-args: --exclude no-core
